
services:
  # 1. 数据库服务
  db:
    image: mysql:8.0
    container_name: testhub_db
    restart: always
    environment:
      MYSQL_DATABASE: testhub
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    # 必须设置编码，否则中文乱码
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. Redis 服务（Django-Q2 任务队列 + Channels + 缓存）
  redis:
    image: redis:7-alpine
    container_name: testhub_redis
    restart: always
    volumes:
      - redis_data:/data

  # 3. 后端服务 (Django)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: testhub_backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8001:8000"
    environment:
      - DB_NAME=testhub
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_HOST=db
      - DB_PORT=3306
      # debug=false 时必须配置，部署时按实际 IP/域名修改
      - ALLOWED_HOSTS=localhost,127.0.0.1,172.16.0.202
      # ADB over TCP: 容器通过宿主机的 ADB server 连接 Android 设备
      - ADB_SERVER_SOCKET=tcp:host.docker.internal:5037
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 核心启动命令：等待数据库 -> 迁移 -> 初始化策略 -> 启动服务
    command: >
      sh -c "
      echo 'Waiting for DB...';
      while ! nc -z db 3306; do sleep 1; done;
      echo 'Running migrations...';
      python manage.py migrate;
      echo 'Init strategies...';
      python manage.py init_locator_strategies;
      echo 'Starting Django...';
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./expand:/expand
      - ./logs:/app/logs
      - ./docker/config.yaml:/app/config.yaml:ro

  # 4. Django-Q2 任务队列 Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: testhub_worker
    restart: always
    depends_on:
      - backend
    environment:
      - DB_NAME=testhub
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_HOST=db
      - DB_PORT=3306
      - ALLOWED_HOSTS=localhost,127.0.0.1,172.16.0.202
      # ADB over TCP: 容器通过宿主机的 ADB server 连接 Android 设备
      - ADB_SERVER_SOCKET=tcp:host.docker.internal:5037
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python manage.py qcluster
    volumes:
      - ./expand:/expand
      - ./logs:/app/logs
      - ./docker/config.yaml:/app/config.yaml:ro

  # 5. 前端服务 (Vite Dev Server)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: testhub_frontend
    ports:
      - "5173:3000"
    volumes:
      # sync-config.js 解析路径为 /config.yaml，必须挂载到此位置
      - ./docker/config.yaml:/config.yaml:ro
    depends_on:
      - backend

  # 6. Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: testhub_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  db_data:
  redis_data:

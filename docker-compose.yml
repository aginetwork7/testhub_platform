
services:
  # 1. 数据库服务
  db:
    image: mysql:8.0
    container_name: testhub_db
    restart: always
    environment:
      MYSQL_DATABASE: testhub
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    # 必须设置编码，否则中文乱码
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. Redis 服务（Django-Q2 任务队列 + Channels + 缓存）
  redis:
    image: redis:7-alpine
    container_name: testhub_redis
    restart: always
    volumes:
      - redis_data:/data

  # 3. 后端服务 (Django)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: testhub_backend
    restart: unless-stopped
    gpus: all
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8001:8000"
    environment:
      - DB_NAME=testhub
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/
      - API_AUTOMATION_RUNNER_URL=http://api-automation-runner:19000
      - API_AUTOMATION_RUNNER_TOKEN=${API_AUTOMATION_RUNNER_TOKEN:-}
      - DEVICE_CLI_RUNNER_URL=http://device-cli-runner:19001
      - DEVICE_CLI_RUNNER_TOKEN=${DEVICE_CLI_RUNNER_TOKEN:-}
      - API_AUTOMATION_SWAGGER_TOKEN=${API_AUTOMATION_SWAGGER_TOKEN:-}
      - HERMES_BASE_URL=${HERMES_BASE_URL:-http://host.docker.internal:8642/v1}
      - HERMES_MODEL_NAME=${HERMES_MODEL_NAME:-hermes-agent}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_API_KEY_FILE=${HERMES_API_KEY_FILE:-/run/secrets/hermes_api_key}
      - IN_DOCKER=true
      - OCR_USE_GPU=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # debug=false 时必须配置，部署时按实际 IP/域名修改
      - ALLOWED_HOSTS=localhost,127.0.0.1,172.16.0.202
      # ADB over TCP: 容器通过宿主机的 ADB server 连接 Android 设备
      - ADB_SERVER_SOCKET=tcp:host.docker.internal:5037
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 核心启动命令：等待数据库 -> 迁移 -> 初始化策略 -> 启动服务
    command: >
      sh -c "
      echo 'Waiting for DB...';
      while ! nc -z db 3306; do sleep 1; done;
      echo 'Running migrations...';
      python manage.py migrate;
      echo 'Init strategies...';
      python manage.py init_locator_strategies;
      echo 'Starting Django...';
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      # 开发态直接挂载 backend 源码，避免每次改 Python 后都需要 docker cp
      - ./backend:/app
      - ./Data:/Data
      - ./expand:/expand
      - ./logs:/app/logs
      - ./media:/media
      - ./config.yaml:/app/config.yaml:ro
      - ${HERMES_API_KEY_FILE_HOST:-$HOME/.secrets/hermes_api_key}:/run/secrets/hermes_api_key:ro

  # 4. Django-Q2 任务队列 Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: testhub_worker
    restart: always
    gpus: all
    depends_on:
      backend:
        condition: service_started
      api-automation-runner:
        condition: service_healthy
    environment:
      - DB_NAME=testhub
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/
      - API_AUTOMATION_RUNNER_URL=http://api-automation-runner:19000
      - API_AUTOMATION_RUNNER_TOKEN=${API_AUTOMATION_RUNNER_TOKEN:-}
      - HERMES_BASE_URL=${HERMES_BASE_URL:-http://host.docker.internal:8642/v1}
      - HERMES_MODEL_NAME=${HERMES_MODEL_NAME:-hermes-agent}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_API_KEY_FILE=${HERMES_API_KEY_FILE:-/run/secrets/hermes_api_key}
      - IN_DOCKER=true
      - OCR_USE_GPU=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ALLOWED_HOSTS=localhost,127.0.0.1,172.16.0.202
      # ADB over TCP: 容器通过宿主机的 ADB server 连接 Android 设备
      - ADB_SERVER_SOCKET=tcp:host.docker.internal:5037
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python manage.py qcluster
    volumes:
      # Worker 与 backend 使用同一份宿主机源码，避免异步任务继续跑旧代码
      - ./backend:/app
      - ./Data:/Data
      - ./expand:/expand
      - ./logs:/app/logs
      - ./media:/media
      - ./config.yaml:/app/config.yaml:ro
      - ${HERMES_API_KEY_FILE_HOST:-$HOME/.secrets/hermes_api_key}:/run/secrets/hermes_api_key:ro

  # 5. API 自动化报告目录初始化（仅创建目录并授权给 Runner 用户）
  api-automation-artifact-init:
    image: alpine:3.21
    user: "0:0"
    command: sh -c 'mkdir -p /artifacts && chown -R 100:101 /artifacts'
    volumes:
      - ./media/api-automation:/artifacts

  # 6. API 自动化 pytest Runner（仅内部网络访问）
  api-automation-runner:
    build:
      context: .
      dockerfile: Dockerfile.api-automation-runner
    restart: always
    depends_on:
      api-automation-artifact-init:
        condition: service_completed_successfully
    environment:
      - API_AUTOMATION_RUNNER_TOKEN=${API_AUTOMATION_RUNNER_TOKEN:-}
      - API_AUTOMATION_RUNNER_WORK_ROOT=/work
      - API_AUTOMATION_RUNNER_ARTIFACT_ROOT=/artifacts
      - API_AUTOMATION_RUNNER_MAX_REQUEST_BYTES=1048576
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
      - /work:rw,nosuid,size=512m,uid=100,gid=101,mode=700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./media/api-automation:/artifacts

  device-cli-runner:
    build:
      context: .
      dockerfile: Dockerfile.device-cli-runner
    restart: always
    environment:
      - DEVICE_CLI_RUNNER_TOKEN=${DEVICE_CLI_RUNNER_TOKEN:-}
      - DEVICE_CLI_RUNNER_MAX_REQUEST_BYTES=32768
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19001/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 7. 前端服务 (Vite Dev Server)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: testhub_frontend
    restart: unless-stopped
    ports:
      - "5173:3000"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    volumes:
      # 开发态直接挂载 frontend 源码，避免页面改动仍停留在旧镜像
      - ./frontend:/app
      - /app/node_modules
      # sync-config.js 解析路径为 /config.yaml，挂载根目录配置文件
      - ./config.yaml:/config.yaml:ro
    depends_on:
      - backend

  # 6. Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: testhub_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  db_data:
  redis_data:

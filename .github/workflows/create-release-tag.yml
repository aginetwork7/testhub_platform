name: Create Release Tag

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  create-tag:
    name: Tag Latest Base Commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out base
        uses: actions/checkout@v4
        with:
          ref: base
          fetch-depth: 0

      - name: Calculate next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          latest_tag="$(git for-each-ref --format='%(refname:strip=2)' refs/tags \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1 || true)"

          if [[ -z "$latest_tag" ]]; then
            next_tag="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest_tag#v}"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi

          printf 'tag=%s\n' "$next_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push annotated tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Publish summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          printf 'Created **%s** from `%s`.\n' "$TAG" "$(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
id: device_cli.execute
name: Device CLI Execute
description: Execute a registered device command through an environment-scoped remote SSH session.
required_inputs:
  - device_id
optional_inputs:
  - command
  - operation
  - arguments
  - timeout_seconds
executor: apps.api_automation.device_cli_skill.DeviceCliSkill
security:
  credential_source: environment_auth_profile
  command_policy: blacklist
  execution_boundary: device_cli_runner
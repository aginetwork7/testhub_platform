# TestHub 的 server 段。以目录方式挂载到 /etc/nginx/conf.d/，配置改动后 nginx -s reload 即可生效。
#
# 此前这份配置以单文件方式挂载整个 nginx.conf。Docker 的单文件绑定挂载绑定的是 inode 而不是
# 路径，而部署时 git pull 是写新文件再重命名覆盖，会产生新的 inode，容器里的挂载点仍指向旧
# inode——文件看起来已经更新，容器读到的却还是旧内容，reload 也无效。2026-09-16 实测过一次：
# 宿主机 inode 31492139/2322 字节已含修复，容器内 inode 31472748/2063 字节仍是旧版。
#
# http 级的 mime.types、default_type、sendfile、keepalive_timeout 由镜像自带的主配置提供，
# 这里不再重复；原本位于 http 块的 client_max_body_size 下沉到 server 级。

server {
    listen 80;
    server_name localhost;

    client_max_body_size 160m;

    # 前端
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 后端接口
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 160m;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Django 管理后台
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
    }

    # 静态文件
    location /static/ {
        proxy_pass http://backend:8000/static/;
        # 不带 Host 头时 nginx 默认发送 Host: backend:8000，正式环境的
        # ALLOWED_HOSTS 不含该名字，Django 会返回 400。
        proxy_set_header Host $host;
    }

    # Media 文件（GIF回放、Allure报告、AI 测试截图等）
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
    }
}
